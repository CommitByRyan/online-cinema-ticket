# ==================== 数据源配置 ====================
# 默认连接本地 MySQL 3307 端口的 ordermeal 数据库。
# 可通过环境变量覆盖，便于在不同环境部署：
#   DB_URL / DB_USER / DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/ordermeal?serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=utf8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== MyBatis 配置 ====================
# mapper.xml 位置：classpath 下的 mapper 目录
mybatis.mapper-locations=classpath:mapper/*.xml
# 实体类别名包，XML 中可直接使用类名
mybatis.type-aliases-package=com.group7.olineordermeal.entity

# ==================== Thymeleaf 配置 ====================
# 开发阶段关闭模板缓存，修改模板后刷新即生效
spring.thymeleaf.cache=false

# ==================== 服务配置 ====================
server.port=8080

# 待支付订单超时时间（分钟），超时由定时任务自动取消
order.expire-minutes=15

# 菜品图片上传目录（相对项目根目录）
file.upload-dir=upload/images

# 上传文件大小限制，超出返回 413
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ==================== 日志配置 ====================
logging.level.org.springframework.web=DEBUG
