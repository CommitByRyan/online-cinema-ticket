<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>购物车</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>购物车</h2>

    <!-- 返回继续点餐 -->
    <a th:href="@{/dish/list}" class="btn btn-secondary mb-3">继续点餐</a>

    <!-- 清空购物车（POST 表单） -->
    <form th:action="@{/cart/clear}" method="post" class="d-inline">
        <button type="submit" class="btn btn-danger mb-3"
                onclick="return confirm('确定清空购物车？')">清空购物车</button>
    </form>

    <table class="table table-bordered">
        <thead class="table-light">
        <tr>
            <th>菜品</th>
            <th>单价</th>
            <th>数量</th>
            <th>小计</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <!-- ---------- 有商品时 ---------- -->
        <tr th:each="item : ${items}">
            <td th:text="${item.dishName} + ' (' + ${item.merchantName} + ')'"></td>
            <td th:text="'¥' + ${item.price}"></td>
            <td>
                <!-- 修改数量（即时提交） -->
                <form th:action="@{/cart/update}" method="post" class="d-inline">
                    <input type="hidden" name="dishId" th:value="${item.dishId}" />
                    <input type="number" name="quantity"
                           th:value="${item.quantity}"
                           min="1" class="form-control form-control-sm"
                           style="width:70px;"
                           onchange="this.form.submit()">
                </form>
            </td>
            <td th:text="'¥' + ${item.subtotal}"></td>
            <td>
                <!-- 删除单条（POST 表单） -->
                <form th:action="@{/cart/remove}" method="post" class="d-inline">
                    <input type="hidden" name="dishId" th:value="${item.dishId}" />
                    <button type="submit" class="btn btn-sm btn-danger"
                            onclick="return confirm('确定删除该商品？')">删除</button>
                </form>
            </td>
        </tr>

        <!-- ---------- 空购物车时 ---------- -->
        <tr th:if="${items.isEmpty()}">
            <td colspan="5" class="text-center text-muted">
                购物车空空如也，去 <a th:href="@{/dish/list}">点餐</a> 吧
            </td>
        </tr>
        </tbody>

        <!-- ---------- 合计行（仅在有商品时显示） ---------- -->
        <tfoot th:if="${!items.isEmpty()}">
        <tr>
            <th colspan="3" class="text-end">总计：</th>
            <th th:text="'¥' + ${total}"></th>
            <th>
                <a th:href="@{/order/confirm}" class="btn btn-success btn-sm">去结算</a>
            </th>
        </tr>
        </tfoot>
    </table>
</div>
</body>
</html>
