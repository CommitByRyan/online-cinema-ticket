<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的收货地址</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>收货地址</h2>
    <a href="/user/address/add" class="btn btn-primary mb-3">新增地址</a>

    <table class="table table-bordered">
        <thead class="table-light">
        <tr>
            <th>收货人</th>
            <th>手机号</th>
            <th>省/市/区</th>
            <th>详细地址</th>
            <th>默认</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <!-- 这里遍历 addressList -->
        <tr th:each="addr : ${addressList}">
            <td th:text="${addr.receiverName}"></td>
            <td th:text="${addr.phone}"></td>
            <td th:text="${addr.province} + ' ' + ${addr.city} + ' ' + ${addr.district}"></td>
            <td th:text="${addr.detailAddress}"></td>
            <td th:text="${addr.isDefault == 1 ? '是' : '否'}"></td>
            <td>
                <a th:href="@{'/user/address/edit/' + ${addr.id}}" class="btn btn-sm btn-warning">编辑</a>
                <a th:href="@{'/user/address/delete/' + ${addr.id}}" class="btn btn-sm btn-danger"
                   onclick="return confirm('确定删除？')">删除</a>
                <a th:if="${addr.isDefault == 0}"
                   th:href="@{'/user/address/setDefault/' + ${addr.id}}"
                   class="btn btn-sm btn-secondary">设为默认</a>
            </td>
        </tr>
        <tr th:if="${addressList.isEmpty()}">
            <td colspan="6" class="text-center text-muted">暂无收货地址，请先添加。</td>
        </tr>
        </tbody>
    </table>

    <a href="/user/profile" class="btn btn-link">返回个人中心</a>
</div>
</body>
</html>
