<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>个人中心</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>个人中心</h2>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="row">
        <div class="col-md-6">
            <div class="card mb-3">
                <div class="card-header">修改密码</div>
                <div class="card-body">
                    <form method="post" action="/user/updatePassword">
                        <div class="mb-2">
                            <label>原密码</label>
                            <input type="password" name="oldPassword" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label>新密码</label>
                            <input type="password" name="newPassword" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary">修改密码</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card mb-3">
                <div class="card-header">修改手机号</div>
                <div class="card-body">
                    <p>当前手机号：<span th:text="${user.phone}"></span></p>
                    <form method="post" action="/user/updatePhone">
                        <div class="mb-2">
                            <label>新手机号</label>
                            <input type="tel" name="newPhone" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-info">更新手机号</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/user/address}" class="btn btn-outline-secondary">地址管理</a>

        <a href="/user/orders" class="btn btn-outline-secondary">我的订单</a>
        <a href="/logout" class="btn btn-outline-danger">退出登录</a>
    </div>
</div>
</body>
</html>
